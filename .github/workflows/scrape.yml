name: Scrape CBMAL fire incidents

on:
  schedule:
    - cron: "18 */6 * * *"  # Every 6 hours at minute 18

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: scraper
        run: python cbmal_fire_incidents_scraper.py
        continue-on-error: true

      - name: Commit dataset changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/cbmal_fire_incidents.csv data/scraper_run_log.csv

          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "chore: update CBMAL fire incidents dataset"
            git push
          fi

      - name: Fail workflow if scraper failed
        if: steps.scraper.outcome == 'failure'
        run: exit 1