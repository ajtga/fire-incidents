name: Scrape CBMAL fire incidents

on:
  schedule:
    - cron: "18 */6 * * *"  # Every 6 hours at minute 18

  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      incidents_changed: ${{ steps.check_changes.outputs.incidents_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: scraper
        run: python cbmal_fire_incidents_scraper.py
        continue-on-error: true

      - name: Check if dataset or dashboard needs updating
        id: check_changes
        run: |
          if ! git diff --quiet data/cbmal_fire_incidents.csv || [ ! -f docs/index.html ]; then
            echo "incidents_changed=true" >> $GITHUB_OUTPUT
            echo "New fire incidents detected or dashboard missing."
          else
            echo "incidents_changed=false" >> $GITHUB_OUTPUT
            echo "No new fire incidents added."
          fi

      - name: Generate interactive heatmap dashboard
        if: steps.check_changes.outputs.incidents_changed == 'true'
        run: python scripts/generate_dashboard.py

      - name: Commit dataset and map changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ "${{ steps.check_changes.outputs.incidents_changed }}" = "true" ]; then
            git add data/cbmal_fire_incidents.csv docs/index.html
            COMMIT_MSG="chore: update CBMAL fire incidents dataset and interactive dashboard"
          else
            COMMIT_MSG="chore: update scraper telemetry run log"
          fi
          git add data/scraper_run_log.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "$COMMIT_MSG"
            git push
          fi

      - name: Fail workflow if scraper failed
        if: steps.scraper.outcome == 'failure'
        run: exit 1

  deploy:
    needs: scrape
    if: needs.scrape.outputs.incidents_changed == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5